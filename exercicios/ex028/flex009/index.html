<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        div.container {
            background-color: blueviolet;
            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color: black;
            border: 1px solid white;
            color: aqua;
            text-align: center;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">Outro Conteudo</div>
        <div class="item">C</div>
        <div class="item">Outro Conteudo um Pouco maior</div>
        <div class="item">E</div>
        <div class="item">Outro Conteudo Maior ainda, que vai ocupar muito espaço</div>
        <div class="item">G</div>
    </div>
</body>
</html>
